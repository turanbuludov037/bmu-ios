# XcodeGen layihə faylı: GitHub-da Mac serveri bundan BMU.xcodeproj yaradır (Mac-da əl ilə layihə açmağa ehtiyac yoxdur).
name: BMU
options:
  bundleIdPrefix: com.nexora
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: 2.7.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  BMU:
    type: application
    platform: iOS
    sources:
      - path: BMU
    dependencies:
      - package: SwiftSoup
    info:
      path: BMU/Info.plist
      properties:
        CFBundleDisplayName: BMU Mobil
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexora.beueduaz
        PRODUCT_NAME: BMU
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES

schemes:
  BMU:
    build:
      targets:
        BMU: all
    run:
      config: Debug
    archive:
      config: Release
